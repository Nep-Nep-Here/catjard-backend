spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          # MECANISMO DE SEGURIDAD: política CORS centralizada en el gateway.
          # Solo se aceptan peticiones desde el origen del frontend (localhost:5173).
          # Esto bloquea el envío de credenciales desde dominios no autorizados (anti-CSRF
          # cross-origin) y reduce la superficie de ataque de la API.
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "${FRONT_ORIGIN:http://localhost:5173}"   # origen del frontend (env en Docker)
                allowed-methods: ["GET", "POST", "PATCH", "PUT", "DELETE", "OPTIONS"]
                allowed-headers: "*"
                allow-credentials: true        # permite enviar el header Authorization
                max-age: 3600                  # cachea el preflight 1 h
          routes:
            # identity-service
            - id: identity-auth
              uri: lb://identity-service
              predicates:
                - Path=/api/auth/**
            - id: identity-usuarios
              uri: lb://identity-service
              predicates:
                - Path=/api/usuarios/**

            # catalog-service
            - id: catalog-productos
              uri: lb://catalog-service
              predicates:
                - Path=/api/productos/**
            - id: catalog-categorias
              uri: lb://catalog-service
              predicates:
                - Path=/api/categorias/**
            - id: catalog-tecnicas
              uri: lb://catalog-service
              predicates:
                - Path=/api/tecnicas/**
            - id: catalog-promociones
              uri: lb://catalog-service
              predicates:
                - Path=/api/promociones/**

            # crm-service
            - id: crm-leads
              uri: lb://crm-service
              predicates:
                - Path=/api/leads/**
            - id: crm-clientes
              uri: lb://crm-service
              predicates:
                - Path=/api/clientes/**

            # sales-service
            - id: sales-cotizaciones
              uri: lb://sales-service
              predicates:
                - Path=/api/cotizaciones/**
            - id: sales-pedidos
              uri: lb://sales-service
              predicates:
                - Path=/api/pedidos/**

            # inventory-service
            - id: inventory-proveedores
              uri: lb://inventory-service
              predicates:
                - Path=/api/proveedores/**
            - id: inventory-oc
              uri: lb://inventory-service
              predicates:
                - Path=/api/ordenes-compra/**
            - id: inventory-movimientos
              uri: lb://inventory-service
              predicates:
                - Path=/api/movimientos/**

            # operations-service
            - id: operations-artes
              uri: lb://operations-service
              predicates:
                - Path=/api/artes/**
            - id: operations-tracking
              uri: lb://operations-service
              predicates:
                - Path=/api/tracking/**
            - id: operations-despachos
              uri: lb://operations-service
              predicates:
                - Path=/api/despachos/**

            # solicitudes-service (mesa de ayuda / tickets + Jira)
            - id: solicitudes
              uri: lb://solicitudes-service
              predicates:
                - Path=/api/solicitudes/**
            - id: cambios
              uri: lb://solicitudes-service
              predicates:
                - Path=/api/cambios/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
