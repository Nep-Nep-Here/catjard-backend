spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins:
                  - "http://localhost:5173"
                allowed-methods: ["GET", "POST", "PATCH", "PUT", "DELETE", "OPTIONS"]
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          routes:
            # identity-service
            - id: identity-auth
              uri: lb://identity-service
              predicates:
                - Path=/api/auth/**
            - id: identity-usuarios
              uri: lb://identity-service
              predicates:
                - Path=/api/usuarios/**

            # catalog-service
            - id: catalog-productos
              uri: lb://catalog-service
              predicates:
                - Path=/api/productos/**
            - id: catalog-categorias
              uri: lb://catalog-service
              predicates:
                - Path=/api/categorias/**
            - id: catalog-tecnicas
              uri: lb://catalog-service
              predicates:
                - Path=/api/tecnicas/**
            - id: catalog-promociones
              uri: lb://catalog-service
              predicates:
                - Path=/api/promociones/**

            # crm-service
            - id: crm-leads
              uri: lb://crm-service
              predicates:
                - Path=/api/leads/**
            - id: crm-clientes
              uri: lb://crm-service
              predicates:
                - Path=/api/clientes/**

            # sales-service
            - id: sales-cotizaciones
              uri: lb://sales-service
              predicates:
                - Path=/api/cotizaciones/**
            - id: sales-pedidos
              uri: lb://sales-service
              predicates:
                - Path=/api/pedidos/**

            # inventory-service
            - id: inventory-proveedores
              uri: lb://inventory-service
              predicates:
                - Path=/api/proveedores/**
            - id: inventory-oc
              uri: lb://inventory-service
              predicates:
                - Path=/api/ordenes-compra/**
            - id: inventory-movimientos
              uri: lb://inventory-service
              predicates:
                - Path=/api/movimientos/**

            # operations-service
            - id: operations-artes
              uri: lb://operations-service
              predicates:
                - Path=/api/artes/**
            - id: operations-tracking
              uri: lb://operations-service
              predicates:
                - Path=/api/tracking/**
            - id: operations-despachos
              uri: lb://operations-service
              predicates:
                - Path=/api/despachos/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
