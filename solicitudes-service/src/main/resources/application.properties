spring.application.name=solicitudes-service
server.port=8087

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catjard_solicitudes}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET:ZmI4NDdkN2I1NDhmNGIzN2JjMjNkMjJlOWE5MjUyNTI1MjMyNTNkMmFlMTNmNzJkZWE5MmU4MmM0YzY5OTRiNQ==}

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------- Integracion Jira Cloud ----------------
# Por defecto DESACTIVADA: en local los tickets se crean sin tocar Jira.
# En produccion: setear JIRA_ENABLED=true y las credenciales por variables de entorno.
jira.enabled=${JIRA_ENABLED:true}
jira.base-url=${JIRA_BASE_URL:https://antent.atlassian.net}
jira.email=${JIRA_EMAIL:enderman000028211@gmail.com}
jira.api-token=${JIRA_API_TOKEN:}
jira.project-key=${JIRA_PROJECT_KEY:SCRUM}
# Proyecto Jira del equipo de sistemas (Control de Cambios); las solicitudes van a project-key.
jira.cambios-project-key=${JIRA_CAMBIOS_PROJECT_KEY:CDCCJ}
# Proyecto Jira para la Gestion de Incidentes (tablero GDICJ).
jira.incidentes-project-key=${JIRA_INCIDENTES_PROJECT_KEY:GDICJ}
jira.issue-type=${JIRA_ISSUE_TYPE:Tarea}

# ---------------- Monitoreo Estrategico (DigitalOcean) ----------------
# Sin token la integracion queda apagada (no se llama a DO). Crear el token en:
# DigitalOcean -> API -> Tokens -> Generate New Token (alcance de LECTURA basta).
monitoreo.enabled=${DO_MONITOREO_ENABLED:true}
monitoreo.api-token=${DO_API_TOKEN:}
# Opcional: ID numerico del droplet (esta en la URL del panel). Si falta, usa el primero.
monitoreo.droplet-id=${DO_DROPLET_ID:}
# Cada cuanto se leen las metricas (ms) y cooldown anti-ruido (min).
monitoreo.sync-interval-ms=${DO_SYNC_INTERVAL_MS:60000}
monitoreo.cooldown-min=${DO_COOLDOWN_MIN:15}
# Umbrales de clasificacion (Fase 1). Defaults en codigo: cpu 60/80/90 %,
# memoria 70/85/95 %, disco 80/90/95 %, load 5/10/15, red 30/50/100 Mbps.
# Se pueden sobreescribir aqui, p.ej.: monitoreo.cpu.warning=25 (util para demos).
#
# Umbrales ajustados para DEMO (advertencia / alto / critico):
#   CPU  30 / 60 / 90 %   (en reposo ~2%, sin falsas alertas)
#   Load  1 /  2 /  5     (en reposo ~0.06)
# RAM/Disco NO se bajan: la RAM en reposo (~49%) dispararia alerta permanente.
monitoreo.cpu.warning=30
monitoreo.cpu.error=60
monitoreo.cpu.critical=90
monitoreo.load.warning=1
monitoreo.load.error=2
monitoreo.load.critical=5

# ----- Gestion de Continuidad y DRP -----
# Token compartido con el cron de respaldos del Droplet (header X-Backup-Token
# de POST /api/continuidad/respaldos/script). Vacio = endpoint deshabilitado.
continuidad.backup-token=${CONTINUIDAD_BACKUP_TOKEN:}

# ----- Exportacion de respaldo local (boton "Descargar copia local", regla 3-2-1) -----
# Ruta al ejecutable pg_dump. Default = PostgreSQL 18 en Windows (igual que los scripts
# de scripts/backup/). En Linux/Droplet seria /usr/bin/pg_dump (sin .exe).
# host/port apuntan al mismo cluster local; user/password se reusan del datasource.
backup.pg-dump-path=${BACKUP_PG_DUMP_PATH:C:\\Program Files\\PostgreSQL\\18\\bin\\pg_dump.exe}
backup.db-host=${BACKUP_DB_HOST:localhost}
backup.db-port=${BACKUP_DB_PORT:5432}
