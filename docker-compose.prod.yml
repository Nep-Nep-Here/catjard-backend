# Override de PRODUCCIÓN (Droplet 8 GB, acceso por IP/HTTP).
# Uso en el servidor:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Cambios vs. dev:
#  - frontend en puerto 80 (http://IP), API relativa /api (nginx hace proxy al gateway)
#  - eureka y gateway SIN puerto público (solo red interna)
#  - JVMs con heap recortado + mem_limit para caber en 8 GB
#  - contexto del front = ../frontend (layout del servidor: backend/ y frontend/ hermanos)

# Recorte de memoria común a las 9 JVMs (7 microservicios + Eureka + Gateway).
x-jvm-tuning: &jvm-tuning
  JAVA_TOOL_OPTIONS: "-Xmx300m -XX:MaxMetaspaceSize=256m -Xss512k -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"   # acceso solo local (túnel SSH) para inspeccionar la BD
    mem_limit: 384m

  eureka-server:
    environment:
      <<: *jvm-tuning
    ports: !override []   # sin exposición pública (uso interno)
    mem_limit: 700m

  api-gateway:
    environment:
      <<: *jvm-tuning
      FRONT_ORIGIN: "http://${SERVER_IP}"
    ports: !override []   # nginx hace proxy interno; no se expone al exterior
    mem_limit: 700m

  identity-service:
    environment:
      <<: *jvm-tuning
    mem_limit: 700m

  catalog-service:
    environment:
      <<: *jvm-tuning
    mem_limit: 700m

  crm-service:
    environment:
      <<: *jvm-tuning
    mem_limit: 700m

  sales-service:
    environment:
      <<: *jvm-tuning
    mem_limit: 700m

  inventory-service:
    environment:
      <<: *jvm-tuning
    mem_limit: 700m

  operations-service:
    environment:
      <<: *jvm-tuning
    mem_limit: 700m

  solicitudes-service:
    environment:
      <<: *jvm-tuning
      # Integracion Jira en produccion: definir estas variables en el .env del servidor.
      JIRA_ENABLED: ${JIRA_ENABLED:-false}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-}
      JIRA_EMAIL: ${JIRA_EMAIL:-}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-}
      JIRA_PROJECT_KEY: ${JIRA_PROJECT_KEY:-SCRUM}
      JIRA_CAMBIOS_PROJECT_KEY: ${JIRA_CAMBIOS_PROJECT_KEY:-CDCCJ}
      JIRA_ISSUE_TYPE: ${JIRA_ISSUE_TYPE:-Tarea}
    mem_limit: 700m

  frontend:
    build:
      context: ../frontend          # en el servidor: ~/catjard/frontend
      args:
        VITE_API_BASE_URL: /api     # relativo => nginx proxya al gateway
    ports: !override
      - "80:80"
    mem_limit: 64m
