spring.application.name=sales-service
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/catjard_sales
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=ZmI4NDdkN2I1NDhmNGIzN2JjMjNkMjJlOWE5MjUyNTI1MjMyNTNkMmFlMTNmNzJkZWE5MmU4MmM0YzY5OTRiNQ==

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
