spring.application.name=catalog-service
server.port=8082

# === PostgreSQL ===
spring.datasource.url=jdbc:postgresql://localhost:5432/catjard_catalog
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# === Flyway ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# === JWT (SAME secret as identity-service) ===
jwt.secret=ZmI4NDdkN2I1NDhmNGIzN2JjMjNkMjJlOWE5MjUyNTI1MjMyNTNkMmFlMTNmNzJkZWE5MmU4MmM0YzY5OTRiNQ==

# === Eureka ===
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# === Swagger ===
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# === Logging ===
logging.level.org.springframework.security=INFO
logging.level.com.catjard=DEBUG
