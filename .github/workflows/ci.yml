name: CI — Catjard Backend

# Integracion Continua de referencia (basada en el flujo del proyecto modelo):
#   Detectar cambios  ->  Unit tests  ->  Integration tests  ->  Cobertura >= 80%
# Un job por microservicio (matrix). "En base a los tests se aprueba".

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  COVERAGE_MIN: "80"   # umbral de cobertura (%) de referencia

jobs:
  # 1) Detecta que microservicios cambiaron para no probar de mas.
  #    Si nada de servicios cambio (o es disparo manual), procesa todos.
  detectar-cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api-gateway: 'api-gateway/**'
            eureka-server: 'eureka-server/**'
            identity-service: 'identity-service/**'
            catalog-service: 'catalog-service/**'
            crm-service: 'crm-service/**'
            sales-service: 'sales-service/**'
            inventory-service: 'inventory-service/**'
            operations-service: 'operations-service/**'
            solicitudes-service: 'solicitudes-service/**'
      - id: matrix
        shell: bash
        run: |
          ALL='["api-gateway","eureka-server","identity-service","catalog-service","crm-service","sales-service","inventory-service","operations-service","solicitudes-service"]'
          CHANGED='${{ steps.filter.outputs.changes }}'
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$CHANGED" ] || [ "$CHANGED" = "[]" ]; then
            echo "services=$ALL" >> "$GITHUB_OUTPUT"
          else
            echo "services=$CHANGED" >> "$GITHUB_OUTPUT"
          fi
      - run: echo "Servicios a procesar -> ${{ steps.matrix.outputs.services }}" >> "$GITHUB_STEP_SUMMARY"

  # 2) Tests unitarios (Surefire, *Test.java) por servicio.
  unit-tests:
    name: Unit — ${{ matrix.service }}
    needs: detectar-cambios
    if: needs.detectar-cambios.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detectar-cambios.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: mvn test
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp test
      - name: Resumen de tests
        if: always()
        shell: bash
        run: |
          DIR=target/surefire-reports
          if ls "$DIR"/*.xml >/dev/null 2>&1; then
            T=$(grep -ho 'tests="[0-9]*"' "$DIR"/*.xml | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
            F=$(grep -ho 'failures="[0-9]*"' "$DIR"/*.xml | grep -o '[0-9]*' | awk '{s+=$1} END{print s+0}')
            echo "### Unit — ${{ matrix.service }}: ${T} tests, ${F} fallos" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Unit — ${{ matrix.service }}: sin tests" >> "$GITHUB_STEP_SUMMARY"
          fi

  # 3) Tests de integracion (Failsafe, *IT.java). Pasan aunque no haya IT todavia.
  integration-tests:
    name: IT — ${{ matrix.service }}
    needs: [ detectar-cambios, unit-tests ]
    if: needs.detectar-cambios.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detectar-cambios.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: mvn verify (solo integracion)
        working-directory: ${{ matrix.service }}
        run: mvn -B -ntp verify -Dsurefire.skip=true

  # 4) Cobertura con JaCoCo. Umbral de referencia 80%. Informativo (no bloquea
  #    el pipeline): reporta el % por servicio en el resumen del job.
  coverage-check:
    name: Cobertura >= 80% — ${{ matrix.service }}
    needs: [ detectar-cambios, integration-tests ]
    if: needs.detectar-cambios.outputs.services != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detectar-cambios.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Ejecutar JaCoCo
        working-directory: ${{ matrix.service }}
        run: |
          mvn -B -ntp \
            org.jacoco:jacoco-maven-plugin:0.8.13:prepare-agent \
            test \
            org.jacoco:jacoco-maven-plugin:0.8.13:report
      - name: Verificar umbral de cobertura
        working-directory: ${{ matrix.service }}
        shell: bash
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ ! -f "$CSV" ]; then
            echo "### Cobertura — ${{ matrix.service }}: sin datos (servicio sin tests)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          MISS=$(awk -F, 'NR>1 {m+=$4} END{print m+0}' "$CSV")
          COV=$(awk -F, 'NR>1 {c+=$5} END{print c+0}' "$CSV")
          TOTAL=$((MISS + COV))
          if [ "$TOTAL" -eq 0 ]; then PCT=0; else PCT=$((100 * COV / TOTAL)); fi
          echo "Cobertura ${{ matrix.service }}: ${PCT}% (umbral ${{ env.COVERAGE_MIN }}%)"
          echo "### Cobertura — ${{ matrix.service }}: ${PCT}% (umbral ${{ env.COVERAGE_MIN }}%)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PCT" -lt "${{ env.COVERAGE_MIN }}" ]; then
            echo "::warning::Cobertura de ${{ matrix.service }} (${PCT}%) por debajo del umbral de referencia (${{ env.COVERAGE_MIN }}%)."
          fi
